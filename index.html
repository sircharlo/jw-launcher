<!doctype html>
<html lang="en">
  <head>
    <title>JW Launcher</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https: blob:; connect-src https:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-dark-5/dist/css/bootstrap-dark.min.css"
    />
    <link
      rel="stylesheet"
      href="node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta name="color-scheme" content="light dark" />
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/select2/dist/js/select2.min.js"></script>
    <script src="node_modules/inputmask/dist/jquery.inputmask.min.js"></script>
    <script src="node_modules/axios/dist/axios.min.js"></script>
    <link
      rel="stylesheet"
      href="node_modules/select2/dist/css/select2.min.css"
    />
  </head>

  <body>
    <div id="overlayInternetCheck" class="overlay justify-content-center">
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-wifi"></i>
        </div>
        <div class="align-self-center fa-2x" role="status">
          <i class="fas fa-circle-notch fa-spin"></i>
        </div>
      </div>
    </div>
    <div
      id="overlayPleaseWait"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-tasks"></i>
        </div>
        <div class="align-self-center fa-2x" role="status">
          <i class="fas fa-circle-notch fa-spin"></i>
        </div>
        <div class="align-self-center" role="status" style="display: none">
          <div class="progress" id="loadingProgress">
            <div class="progress-bar" role="progressbar"></div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="overlayInternetFail"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-wifi"></i>
        </div>
        <div class="align-self-center text-danger fa-2x" role="status">
          <i class="fas fa-circle-notch fa-spin"></i>
        </div>
      </div>
    </div>
    <div
      id="overlayUpdateCheck"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-wifi"></i>
        </div>
        <div class="align-self-center text-success fa-2x" role="status">
          <i class="fas fa-check-circle"></i>
        </div>
      </div>
    </div>
    <div
      id="overlayUpdateAvailable"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-cloud-download-alt"></i>
        </div>
        <div class="align-self-center text-warning fa-2x" role="status">
          <i class="fas fa-circle-notch fa-spin"></i>
        </div>
      </div>
    </div>
    <div
      id="overlayUpdateDownloaded"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-cloud-download-alt"></i>
        </div>
        <div class="align-self-center text-success fa-2x" role="status">
          <i class="fas fa-check-circle"></i>
        </div>
      </div>
    </div>
    <div
      id="overlayScheduledAction"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center">
        <div class="align-self-center fa-5x" role="status">
          <i class="fas fa-fw fa-clock"></i>
        </div>
        <div class="align-self-center" role="status">
          <h3 id="actionDesc"></h3>
        </div>
        <div class="align-self-center" role="status">
          <div class="progress" id="scheduledDelayProgress">
            <div class="progress-bar" role="progressbar"></div>
          </div>
        </div>
        <div class="align-self-center fa-2x" role="status">
          <button type="button" class="btn btn-danger">
            <i class="fas fa-fw fa-hand-paper"></i>
          </button>
        </div>
      </div>
    </div>
    <div
      id="overlaySettings"
      class="flex-column p-2 overlay"
      style="display: none"
    >
      <div
        class="flex-column flex-grow-1 w-100"
        style="display: flex; overflow-y: auto"
      >
        <div class="accordion" id="settingsAccordion">
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingUser">
              <button
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseUser"
                aria-expanded="true"
                aria-controls="collapseUser"
              >
                User preferences
              </button>
            </h2>
            <div
              id="collapseUser"
              class="accordion-collapse collapse show"
              aria-labelledby="headingUser"
            >
              <div class="accordion-body">
                <table class="table table-sm table-hover">
                  <tbody>
                    <tr>
                      <td class="col-3">
                        <div class="desc">
                          <label for="username" class="w-100"
                            >Zoom display name</label
                          >
                        </div>
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          id="username"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <td class="col-3">
                        <div class="desc">
                          <label for="broadcastLang" class="w-100"
                            >Language for JW Broadcasting</label
                          >
                        </div>
                      </td>
                      <td>
                        <select
                          class="form-select"
                          id="broadcastLang"
                          style="width: 100%"
                        >
                          <option></option>
                        </select>
                      </td>
                    </tr>
                    <tr class="onOffToggle">
                      <td class="col-3">
                        <div class="desc">
                          <label for="autoRunAtBoot">Autorun at startup</label>
                        </div>
                      </td>
                      <td>
                        <div class="form-check form-switch">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="autoRunAtBoot"
                          />
                          <label
                            class="form-check-label"
                            for="enableSettings"
                          ></label>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingMediaLinks">
              <button
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseMediaLinks"
                aria-expanded="false"
                aria-controls="collapseMediaLinks"
              >
                Links to meetings and special events
              </button>
            </h2>
            <div
              id="collapseMediaLinks"
              class="accordion-collapse collapse show"
              aria-labelledby="headingMediaLinks"
            >
              <div class="accordion-body">
                <table class="table table-sm links table-hover">
                  <thead>
                    <tr class="text-start">
                      <th scope="col" class="col-3">Link type</th>
                      <th scope="col" class="col-3">Label</th>
                      <th scope="col" class="col-5">Connection details</th>
                      <th scope="col" class="col-1 text-end">
                        <button
                          type="button"
                          class="btn btn-success btn-sm btn-add-link"
                        >
                          <i class="fas fa-plus"></i>
                        </button>
                      </th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
                <input id="linkArray" type="hidden" />
              </div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingSchedule">
              <button
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseSchedule"
                aria-expanded="false"
                aria-controls="collapseSchedule"
              >
                Schedule
              </button>
            </h2>
            <div
              id="collapseSchedule"
              class="accordion-collapse collapse show"
              aria-labelledby="headingSchedule"
            >
              <div class="accordion-body">
                <table class="table table-sm schedule table-hover">
                  <thead>
                    <tr class="text-start">
                      <th scope="col" class="col-3">Day</th>
                      <th scope="col" class="col-1">Time</th>
                      <th scope="col" class="col-7">Action to trigger</th>
                      <th scope="col" class="col-1 text-end">
                        <button
                          type="button"
                          class="btn btn-light btn-sm btn-sort-schedules me-1 text-dark"
                        >
                          <i class="fas fa-sort-amount-up"></i>
                        </button>
                        <button
                          type="button"
                          class="btn btn-success btn-sm btn-add-schedule"
                        >
                          <i class="fas fa-plus"></i>
                        </button>
                      </th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
                <input id="scheduleArray" type="hidden" />
              </div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingActions">
              <button
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseActions"
                aria-expanded="false"
                aria-controls="collapseActions"
              >
                Action buttons
              </button>
            </h2>
            <div
              id="collapseActions"
              class="accordion-collapse collapse show"
              aria-labelledby="headingActions"
            >
              <div class="accordion-body">
                <table class="table table-sm table-hover">
                  <thead>
                    <tr class="text-start">
                      <th scope="col" class="col-3">Action</th>
                      <th scope="col" class="col-6">Label</th>
                      <th scope="col" class="col-1 text-center">Shortcut</th>
                      <th scope="col" class="col-1 text-center">Confirm?</th>
                      <th scope="col" class="col-1 text-end">Show</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="onOffToggle">
                      <td>
                        <div class="desc">Shutdown computer</div>
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          placeholder="Shutdown"
                          id="labelShutdown"
                          required
                        />
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableShortcutShutdown"
                          />
                          <label
                            class="form-check-label"
                            for="enableShortcutShutdown"
                          ></label>
                        </div>
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input"
                            id="confirmShutdown"
                          />
                          <label
                            class="form-check-label"
                            for="confirmShutdown"
                          ></label>
                        </div>
                      </td>
                      <td>
                        <div class="form-check form-switch">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableShutdown"
                          />
                          <label
                            class="form-check-label"
                            for="enableShutdown"
                          ></label>
                        </div>
                      </td>
                    </tr>
                    <tr class="onOffToggle">
                      <td>
                        <div class="desc">Initiate TeamViewer session</div>
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          placeholder="Remote assistance"
                          id="labelRemoteAssistance"
                          required
                        />
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableShortcutRemoteAssistance"
                          />
                          <label
                            class="form-check-label"
                            for="enableShortcutRemoteAssistance"
                          ></label>
                        </div>
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input"
                            id="confirmRemoteAssistance"
                          />
                          <label
                            class="form-check-label"
                            for="confirmRemoteAssistance"
                          ></label>
                        </div>
                      </td>
                      <td>
                        <div class="form-check form-switch">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableRemoteAssistance"
                          />
                          <label
                            class="form-check-label"
                            for="enableRemoteAssistance"
                          ></label>
                        </div>
                      </td>
                    </tr>
                    <tr class="onOffToggle">
                      <td>
                        <div class="desc">Configure application settings</div>
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          placeholder="Settings"
                          id="labelSettings"
                          required
                        />
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableShortcutSettings"
                          />
                          <label
                            class="form-check-label"
                            for="enableShortcutSettings"
                          ></label>
                        </div>
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input"
                            id="confirmSettings"
                            disabled
                          />
                          <label
                            class="form-check-label"
                            for="confirmSettings"
                          ></label>
                        </div>
                      </td>
                      <td>
                        <div class="form-check form-switch">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            checked
                            disabled
                            id="enableSettings"
                          />
                          <label
                            class="form-check-label"
                            for="enableSettings"
                          ></label>
                        </div>
                      </td>
                    </tr>
                    <tr class="onOffToggle">
                      <td>
                        <div class="desc">Close application</div>
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          placeholder="Close"
                          id="labelClose"
                          required
                        />
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableShortcutClose"
                          />
                          <label
                            class="form-check-label"
                            for="enableShortcutClose"
                          ></label>
                        </div>
                      </td>
                      <td class="text-center">
                        <div class="form-check form-switch d-inline-block">
                          <input
                            type="checkbox"
                            class="form-check-input"
                            id="confirmClose"
                          />
                          <label
                            class="form-check-label"
                            for="confirmClose"
                          ></label>
                        </div>
                      </td>
                      <td>
                        <div class="form-check form-switch">
                          <input
                            type="checkbox"
                            class="form-check-input optional-action-enabled"
                            id="enableClose"
                          />
                          <label
                            class="form-check-label"
                            for="enableClose"
                          ></label>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="align-items-start mt-2" style="display: flex">
        <div class="col-4">
          <button type="button" class="btn btn-primary" id="btnExport">
            <i class="fas fa-fw fa-file-export"></i> Export settings file
          </button>
        </div>
        <div
          id="version"
          class="align-items-center justify-content-center pt-3 flex-fill col-4"
        >
          <span class="badge bg-secondary"></span>
        </div>
        <div class="col-4 text-end">
          <button type="button" class="btn btn-secondary btnSettings">
            <i class="fas fa-fw fa-home"></i> Go back
          </button>
        </div>
      </div>
    </div>
    <div id="home" class="flex-column h-100 pb-2">
      <div
        class="actions align-items-center gx-2 justify-content-center px-2 row row-cols-3"
      >
        <div class="broadcastContainer flex-grow-1 pt-2">
          <button
            id="broadcast1button"
            type="button"
            class="align-items-center btn btn-lg flex-column h-100 w-100"
          ></button>
        </div>
      </div>
      <div
        class="advanced-actions align-items-center gx-2 justify-content-center pt-2 px-2 row row-cols-auto"
      >
        <div class="flex-grow-1 h-100">
          <button
            class="btn btn-danger d-flex align-items-center justify-content-center w-100 h-100 position-relative"
            id="btnShutdown"
          >
            <div
              class="kbd action-kbd mx-2 position-absolute"
              id="kbdShutdown"
              style="left: 0"
            ></div>
            <div class="text-center">
              <div><i class="fas fa-fw fa-power-off"></i></div>
              <div><span id="lblShutdown"></span></div>
            </div>
          </button>
        </div>
        <div class="flex-grow-1 h-100">
          <button
            class="btn btn-info d-flex align-items-center justify-content-center w-100 h-100 position-relative"
            id="btnRemoteAssistance"
          >
            <div
              class="kbd action-kbd mx-2 position-absolute"
              id="kbdRemoteAssistance"
              style="left: 0"
            ></div>
            <div class="text-center">
              <div><i class="fas fa-fw fa-hands-helping"></i></div>
              <div><span id="lblRemoteAssistance"></span></div>
            </div>
          </button>
        </div>
        <div class="flex-grow-1 h-100" style="display: none">
          <button
            class="btn btn-warning col h-100 justify-content-center w-100"
            id="btn-mac-update"
          >
            <i class="fas fa-fw fa-exclamation-triangle"></i> Update available!
          </button>
        </div>
        <div class="flex-grow-1 h-100">
          <button
            class="btn btn-secondary d-flex align-items-center justify-content-center w-100 h-100 position-relative"
            id="btnSettings"
          >
            <div
              class="kbd action-kbd mx-2 position-absolute"
              id="kbdSettings"
              style="left: 0"
            ></div>
            <div class="text-center">
              <div><i class="fas fa-fw fa-user-cog"></i></div>
              <div><span id="lblSettings"></span></div>
            </div>
          </button>
        </div>
        <div
          class="flex-grow-1 h-100"
          id="btnCloseContainer"
          style="display: none"
        >
          <button
            class="btn btn-warning d-flex align-items-center justify-content-center w-100 h-100 position-relative"
            id="btnClose"
          >
            <div
              class="kbd action-kbd mx-2 position-absolute"
              id="kbdClose"
              style="left: 0"
            ></div>
            <div class="text-center">
              <div><i class="fas fa-fw fa-times"></i></div>
              <div><span id="lblClose"></span></div>
            </div>
          </button>
        </div>
      </div>
    </div>
    <div id="videos" class="overlay flex-column bg-dark" style="display: none">
      <div
        id="videoPlayer"
        class="overlay flex-column bg-dark"
        style="display: none"
      >
        <div id="closeButton" class="bg-danger">
          <kbd>X</kbd>
        </div>
      </div>
      <div
        class="align-items-center h-100 justify-content-center px-2"
        style="display: none"
      >
        <div
          class="featuredVideos g-2 h-100 justify-content-center row row-cols-5 pt-2"
        >
          <div class="mt-0 pt-2">
            <div class="h-100 rounded go-home p-2" id="btnGoHome">
              <div class="flex-column flex-fill h-100 rounded lblGoHome">
                <div class="flex-row">
                  <h5><kbd>A</kbd></h5>
                </div>
                <div
                  class="align-items-center flex-fill flex-row"
                  style="display: flex"
                >
                  <h5 id="lblGoHome"></h5>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div
        class="align-items-center h-100 justify-content-center px-2"
        style="display: none"
      >
        <div
          class="streamingVideos g-2 h-100 justify-content-center row row-cols-4 pt-2"
        >
          <div class="mt-0 pt-2">
            <div class="h-100 rounded go-home p-2" id="btnGoHome2">
              <div class="flex-column flex-fill h-100 rounded lblGoHome2">
                <div class="flex-row">
                  <h5><kbd>A</kbd></h5>
                </div>
                <div
                  class="align-items-center flex-fill flex-row"
                  style="display: flex"
                >
                  <h5 id="lblGoHome2"></h5>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="overlayConfirm"
      class="overlay justify-content-center"
      style="display: none"
    >
      <div class="align-self-center text-center">
        <div class="mb-3">
          <h4 id="overlayConfirmMessage"></h4>
        </div>
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-success" id="overlayConfirmYes">
            <span class="me-2"><kbd>Y</kbd></span
            >Yes
          </button>
          <button type="button" class="btn btn-secondary" id="overlayConfirmNo">
            <span class="me-2"><kbd>N</kbd></span
            >No
          </button>
        </div>
      </div>
    </div>
    <script src="./utils/shortcuts.js"></script>
    <script src="./launcher.js"></script>
  </body>
</html>
